spring:
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: http://localhost:4200
                allowedMethods: GET,POST,PATCH,OPTIONS
                allowedHeaders: "*"
          routes:
            - id: account-service
              uri: lb://ACCOUNT-SERVICE
              predicates:
                - Path=/ACCOUNT-SERVICE/**
              filters:
                - StripPrefix=1
            - id: transaction-service
              uri: lb://TRANSACTION-SERVICE
              predicates:
                - Path=/TRANSACTION-SERVICE/**
              filters:
                - StripPrefix=1
            - id: chatbot-service
              uri: lb://CHATBOT-SERVICE
              predicates:
                - Path=/CHATBOT-SERVICE/**
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
  endpoint:
    gateway:
      access: unrestricted
