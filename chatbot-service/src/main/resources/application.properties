spring.application.name=chatbot-service
server.port=8090
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

spring.ai.mcp.client.streamable-http.connections.account.url=${ACCOUNT_MCP_URL:http://localhost:8081/mcp}
spring.ai.mcp.client.streamable-http.connections.transaction.url=${TRANSACTION_MCP_URL:http://localhost:8082/mcp}

telegram.bot.token=${TELEGRAM_BOT_TOKEN:}

eureka.client.jersey.enabled=false
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
