name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_PREFIX: ghcr.io/mustapha-elmifdali/test-adria

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilation
        run: mvn -B compile
      - name: Tests
        run: mvn -B test
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Angular
        working-directory: angular-front
        run: |
          npm ci
          npm run build

  images:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - discovery-service
          - config-service
          - gateway-service
          - account-service
          - transaction-service
          - chatbot-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construction et publication de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest

  front-image:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construction et publication de l'image
        uses: docker/build-push-action@v6
        with:
          context: angular-front
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-angular-front:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-angular-front:latest

  deploy:
    needs: [images, front-image]
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Schematic step: no real cloud deployment is required
      - name: Déploiement
        run: |
          echo "Déploiement de la version ${{ github.sha }}"
          echo "docker compose pull && docker compose up -d"
