spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: account-service
              uri: lb://ACCOUNT-SERVICE
              predicates:
                - Path=/ACCOUNT-SERVICE/**
              filters:
                - StripPrefix=1
            - id: transaction-service
              uri: lb://TRANSACTION-SERVICE
              predicates:
                - Path=/TRANSACTION-SERVICE/**
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
  endpoint:
    gateway:
      access: unrestricted
