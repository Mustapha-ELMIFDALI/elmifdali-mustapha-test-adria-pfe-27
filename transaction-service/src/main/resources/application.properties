spring.application.name=transaction-service
server.port=8082
spring.datasource.url=jdbc:h2:mem:transactiondb
spring.h2.console.enabled=true
spring.graphql.graphiql.enabled=true
spring.ai.mcp.server.protocol=streamable

bank.transaction.max-amount=1000
account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}

spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

resilience4j.circuitbreaker.instances.accountService.register-health-indicator=true
resilience4j.circuitbreaker.instances.accountService.sliding-window-size=10
resilience4j.circuitbreaker.instances.accountService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.accountService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.accountService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.accountService.ignore-exceptions[0]=org.elmifdali.transactionservice.service.AccountNotFoundException
resilience4j.circuitbreaker.instances.accountService.ignore-exceptions[1]=org.elmifdali.transactionservice.service.TransactionRejectedException

resilience4j.retry.instances.accountService.max-attempts=3
resilience4j.retry.instances.accountService.wait-duration=200ms
resilience4j.retry.instances.accountService.retry-exceptions[0]=feign.RetryableException

management.endpoints.web.exposure.include=health,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
